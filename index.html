<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER-BREACH OS // v2.4</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="crt">
  <!-- Scanline and vignette overlay -->
  <div class="crt-overlay"></div>

  <div class="screen-container">
    <!-- Top System Header -->
    <header class="system-header">
      <div class="header-left">
        <span class="pulse-dot"></span>
        <span class="system-title">CYBER-BREACH OS [v2.4.0-REL]</span>
      </div>
      <div class="header-right">
        <span class="trace-label">INTRUSION TRACE:</span>
        <div class="trace-bar-container">
          <div class="trace-bar" id="trace-bar" style="width: 0%;"></div>
        </div>
        <span id="trace-percentage">0%</span>
        <button id="audio-toggle" class="btn-retro">AUDIO: OFF</button>
        <button id="crt-toggle" class="btn-retro">CRT: ON</button>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="workspace">
      <!-- Left Pane: The Interactive Terminal -->
      <section class="terminal-pane">
        <div class="terminal-header">
          <span>TTY_01 // SECURE_SHELL</span>
          <span id="target-indicator">TARGET: DISCONNECTED</span>
        </div>
        <div class="terminal-output" id="terminal-output">
          <div class="log-entry system-msg">CYBER-BREACH OS INITIALIZED.</div>
          <div class="log-entry system-msg">Type <span class="highlight">help</span> for a list of active subsystems.</div>
        </div>
        <form class="terminal-input-row" id="terminal-form">
          <span class="prompt-symbol">&gt;</span>
          <input 
            type="text" 
            id="terminal-input" 
            autocomplete="off" 
            autocorrect="off" 
            autocapitalize="off" 
            spellcheck="false" 
            autofocus 
          />
        </form>
      </section>

      <!-- Right Pane: Telemetry & Network Visualizer -->
      <aside class="telemetry-pane">
        <div class="telemetry-box">
          <h3>// TOPOLOGY_RADAR</h3>
          <canvas id="network-canvas" width="340" height="240"></canvas>
        </div>
        <div class="telemetry-box">
          <h3>// ACTIVE_MISSION</h3>
          <div id="mission-info" class="mission-text">
            No target acquired. Run <span class="highlight">connect &lt;ip&gt;</span> or <span class="highlight">probe</span> to locate an entry vector.
          </div>
        </div>
      </aside>
    </main>
  </div>

  <!-- Scripts will hook in here in upcoming steps -->
  <script src="js/audio.js"></script>
  <script src="js/terminal.js"></script>
  <script src="js/network.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
